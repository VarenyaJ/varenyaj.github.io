<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Tetris Deluxe v6</title>
<style>
 body {
   background: #111;
   color: #fff;
   font-family: Courier, monospace;
   display: flex;
   flex-direction: column;
   align-items: center;
   margin: 0;
   padding: 10px;
 }
 h1 {
   margin: 5px 0 10px 0;
 }
 #game-area {
   display: flex;
   flex-direction: row;
   gap: 20px;
   align-items: flex-start;
   justify-content: center;
   flex-wrap: wrap;
 }
 #gameCanvas {
   border: 2px solid #fff;
   background: #000;
   width: 240px;
   height: 480px;
 }
 #hud {
   background: #222;
   border: 1px solid #555;
   border-radius: 4px;
   padding: 10px;
   min-width: 100px;
   font-size: 14px;
   display: flex;
   flex-direction: column;
   align-items: center;
 }
 #preview, #hold {
   border: 1px solid #555;
   background: #000;
   margin-bottom: 10px;
   width: 80px;
   height: 80px;
 }
 #flags {
   width: 100%;
   margin-top: 8px;
   font-size: 11px;
   line-height: 1.6em;
 }
 .flag {
   display: flex;
   justify-content: space-between;
   gap: 10px;
   margin-top: 4px;
 }
 .state {
   min-width: 3em;
   padding: 0 4px;
   text-align: center;
   border: 1px solid #888;
   border-radius: 3px;
   background: #333;
   color: #ddd;
 }
 .state.active, kbd.pressed {
   background: #b5ff52;
   color: #111;
   border-color: #b5ff52;
   font-weight: bold;
 }
 kbd {
   display: inline-block;
   padding: 0 4px;
   margin: 2px 0;
   border: 1px solid #888;
   border-radius: 3px;
   background: #292929;
   color: #fff;
   font: inherit;
 }
 #pause-status {
   margin-top: 8px;
   color: #b5ff52;
   font-weight: bold;
 }
 #controls {
   margin-top: 10px;
   font-size: 12px;
   color: #0f0;
   text-align: center;
   line-height: 1.5em;
   max-width: 320px;
 }

 * { box-sizing: border-box; }
 body { padding: max(10px, env(safe-area-inset-top)) max(10px, env(safe-area-inset-right)) max(10px, env(safe-area-inset-bottom)) max(10px, env(safe-area-inset-left)); }
 #gameCanvas { box-sizing: content-box; image-rendering: pixelated; flex: none; }
 #touch-controls { display: none; gap: 8px; width: min(100%, 360px); margin-top: 12px; }
 .touch-row { display: flex; justify-content: center; gap: 8px; }
 #touch-controls button { min-width: 44px; min-height: 48px; flex: 1; padding: 8px; border: 1px solid #777; border-radius: 7px; background: #292929; color: #fff; font: bold 15px Courier, monospace; touch-action: none; user-select: none; -webkit-user-select: none; -webkit-touch-callout: none; }
 #touch-controls button.pressed, #touch-controls button[aria-pressed="true"] { background: #b5ff52; color: #111; }
 #touch-controls button:disabled { opacity: .45; }
 #touch-controls button:focus-visible { outline: 3px solid #b5ff52; outline-offset: 2px; }
 #touch-controls .secondary button { min-height: 44px; font-size: 13px; }
 #flags summary { cursor: pointer; }
 @media (max-width: 700px), (any-pointer: coarse) {
   h1 { font-size: 22px; }
   #game-area { gap: 10px; flex-wrap: nowrap; width: 100%; }
   #hud { flex: none; min-width: 0; width: 125px; padding: 6px; font-size: 12px; }
   #preview, #hold { width: 52px; height: 52px; margin-bottom: 4px; }
   #flags { font-size: 10px; }
   .flag { gap: 4px; }
   #touch-controls { display: grid; }
   #controls { font-size: 11px; }
 }
 @media (max-height: 540px) and (orientation: landscape) {
   body { display: grid; grid-template-columns: minmax(0, 1fr) minmax(180px, 260px); column-gap: 12px; align-content: start; }
   h1 { grid-column: 1 / -1; text-align: center; font-size: 18px; margin-bottom: 6px; }
   #game-area { grid-column: 1; grid-row: 2 / 4; }
   #touch-controls { grid-column: 2; grid-row: 2; align-self: end; }
   #controls { grid-column: 2; grid-row: 3; }
   #preview, #hold { width: 40px; height: 40px; }
 }
</style>
</head>
<body>
<h1>Tetris Deluxe</h1>

<div id="game-area">
 <canvas id="gameCanvas" width="200" height="400"></canvas>

 <div id="hud">
   <canvas id="preview" width="80" height="80"></canvas>
   <canvas id="hold" width="80" height="80"></canvas>
   <div id="score">Score: 0</div>
   <div id="lines">Lines: 0</div>
   <div id="level">Level: 1</div>
   <div id="highscore">High Score: 0</div>

   <div id="pause-status" role="status">Playing</div>
   <div id="flags" aria-live="polite"></div>
 </div>
</div>

<div id="touch-controls" role="group" aria-label="Touch game controls">
 <div class="touch-row">
  <button type="button" data-action="a" aria-label="Move left">◀ Left</button>
  <button type="button" data-action="s" aria-label="Drop one row">▼ Down</button>
  <button type="button" data-action="d" aria-label="Move right">Right ▶</button>
 </div>
 <div class="touch-row">
  <button type="button" data-action="w" aria-label="Rotate clockwise">↻ Rotate</button>
  <button type="button" data-action="p" aria-pressed="false">Pause</button>
 </div>
 <div class="touch-row secondary">
  <button type="button" data-action="c">Hold</button>
  <button type="button" data-action="r">Restart</button>
 </div>
</div>
<div id="controls">
 Move: <kbd data-key="a">A</kbd>/<kbd data-key="d">D</kbd> |
 Rotate: <kbd data-key="w">W</kbd> | Drop: <kbd data-key="s">S</kbd> |
 Hold: <kbd data-key="c">C</kbd><br>
 Pause/Resume: <kbd data-key="p">P</kbd> | Restart: <kbd data-key="r">R</kbd><br>
 Toggles: <kbd data-key="x">X</kbd>=Extra Shapes |
 <kbd data-key="k">K</kbd>=Wall Kick | <kbd data-key="g">G</kbd>=Ghost
</div>

<script>
/* ===== FEATURE TOGGLES ===== */
let ENABLE_HUD = true;
let ENABLE_COMBO = true;
let ENABLE_LEVELS = true;
let ENABLE_HOLD = true;
let ENABLE_EXTRA_SHAPES = false;
let ENABLE_WALL_KICK = true;
let ENABLE_GHOST = false;
/* =========================== */

const canvas = document.getElementById("gameCanvas");
const ctx = canvas.getContext("2d");
const previewCanvas = document.getElementById("preview");
const pctx = previewCanvas.getContext("2d");
const holdCanvas = document.getElementById("hold");
const hctx = holdCanvas.getContext("2d");

const ROWS = 20, COLS = 10, BLOCK = 20;
let board = [];
let score = 0, lines = 0, level = 1, dropInterval = 800;
let paused = false, gameOver = false;
let combo = 0, canHold = true;
let lastTime = 0, dropCounter = 0;
let highScore = 0;
try { highScore = Number(localStorage.getItem("highscore")) || 0; } catch (_) {}
let nextMatrix = null;
let holdMatrix = null;

const COLORS = [null,"#f00","#0f0","#00f","#ff0","#0ff","#f0f","#fa0","#a0f","#08f","#3f3"];
const BASE_SHAPES = {
 I: [[1,1,1,1]],
 J: [[2,0,0],[2,2,2]],
 L: [[0,0,3],[3,3,3]],
 O: [[4,4],[4,4]],
 S: [[0,5,5],[5,5,0]],
 T: [[0,6,0],[6,6,6]],
 Z: [[7,7,0],[0,7,7]]
};
const EXTRA_SHAPES = {
 PLUS: [[0,8,0],[8,8,8],[0,8,0]],
 BIGL: [[9,0,0],[9,0,0],[9,9,9]],
 SMALLS: [[10,10,0],[0,10,10]]
};
function getShapes(){return ENABLE_EXTRA_SHAPES ? {...BASE_SHAPES, ...EXTRA_SHAPES} : BASE_SHAPES;}

function createMatrix(w,h){return Array.from({length:h},()=>Array(w).fill(0));}

function drawMatrix(matrix,offset,context=ctx,blockSize=BLOCK,opacity=1){
 context.globalAlpha=opacity;
 matrix.forEach((row,y)=>row.forEach((val,x)=>{
   if(val){
     context.fillStyle=COLORS[val];
     context.fillRect((x+offset.x)*blockSize,(y+offset.y)*blockSize,blockSize-1,blockSize-1);
   }
 }));
 context.globalAlpha=1;
}

function collide(board,piece){
 const [m,o]=[piece.matrix,piece.pos];
 for(let y=0;y<m.length;y++){
   for(let x=0;x<m[y].length;x++){
     if(m[y][x] && (
       !board[y+o.y] ||
       board[y+o.y][x+o.x]!==0
     )) return true;
   }
 }
 return false;
}

function merge(board,piece){
 piece.matrix.forEach((row,y)=>row.forEach((v,x)=>{
   if(v) board[y+piece.pos.y][x+piece.pos.x]=v;
 }));
}

function rotateMatrix(m){
 const N=m.length,M=m[0].length;
 let r=Array(M).fill().map(()=>Array(N).fill(0));
 for(let y=0;y<N;y++) for(let x=0;x<M;x++) r[x][N-1-y]=m[y][x];
 return r;
}

function playerRotate(dir){
 const old=player.matrix;
 const rotated=dir>0?rotateMatrix(old):rotateMatrix(rotateMatrix(rotateMatrix(old)));
 const pos=player.pos.x;
 player.matrix=rotated;
 if(!ENABLE_WALL_KICK){
   if(collide(board,player)) player.matrix=old;
   return;
 }
 const offsets=[0,1,-1,2,-2];
 for(let o of offsets){
   player.pos.x=pos+o;
   if(!collide(board,player)) return;
 }
 player.matrix=old; player.pos.x=pos;
}

function drawHUD(){
 if(!ENABLE_HUD) return;
 document.getElementById("score").textContent="Score: "+score;
 document.getElementById("lines").textContent="Lines: "+lines;
 document.getElementById("level").textContent="Level: "+level;
 document.getElementById("highscore").textContent="High Score: "+highScore;
}

function arenaSweep(){
 let cleared=0;
 outer: for(let y=board.length-1;y>=0;y--){
   for(let x=0;x<board[y].length;x++){
     if(board[y][x]===0) continue outer;
   }
   board.splice(y,1);
   board.unshift(Array(COLS).fill(0));
   cleared++; y++;
 }
 if(cleared>0){
   lines+=cleared;
   let gain=100*cleared;
   if(ENABLE_COMBO){combo++;gain+=combo*50;}else combo=0;
   if(ENABLE_LEVELS && lines%10===0 && dropInterval>100){level++;dropInterval-=100;}
   score+=gain*level;
 } else combo=0;
 drawHUD();
}

function playerReset(){
 const shapes=Object.keys(getShapes());
 if(!nextMatrix) nextMatrix=getShapes()[shapes[Math.floor(Math.random()*shapes.length)]].map(r=>r.slice());
 player.matrix=nextMatrix;
 player.pos.y=0;
 player.pos.x=(COLS/2|0)-(player.matrix[0].length/2|0);
 nextMatrix=getShapes()[shapes[Math.floor(Math.random()*shapes.length)]].map(r=>r.slice());
 drawPreview();
 canHold=true;
 if(collide(board,player)){
   gameOver=true;
   clearHeldInputs();
   if(score > highScore){
     highScore=score;
     try { localStorage.setItem("highscore",String(highScore)); } catch (_) {}
   }
   drawHUD();
   updateFlagsDisplay();
 }
}

function drawPreview(){
 pctx.fillStyle="#000";pctx.fillRect(0,0,80,80);
 const m=nextMatrix;
 drawMatrix(m,{x:(4-m[0].length)/2,y:(4-m.length)/2},pctx,16);
}

function drawHold(){
 hctx.fillStyle="#000";hctx.fillRect(0,0,80,80);
 if(holdMatrix) drawMatrix(holdMatrix,{x:(4-holdMatrix[0].length)/2,y:(4-holdMatrix.length)/2},hctx,16);
}

function holdPiece(){
 if(!ENABLE_HOLD || !canHold) return;
 if(!holdMatrix){
   holdMatrix=player.matrix;
   playerReset();
 } else {
   [player.matrix,holdMatrix]=[holdMatrix,player.matrix];
   player.pos.y=0;
   player.pos.x=(COLS/2|0)-(player.matrix[0].length/2|0);
 }
 canHold=false;
 drawHold();
}

function playerMove(offset){
 player.pos.x+=offset;
 if(collide(board,player)) player.pos.x-=offset;
}

function playerDrop(){
 player.pos.y++;
 if(collide(board,player)){
   player.pos.y--;
   merge(board,player);
   arenaSweep();
   playerReset();
 }
 dropCounter=0;
}

function drawGhost(){
 if(!ENABLE_GHOST) return;
 let ghostY = player.pos.y;
 while(!collide(board,{matrix:player.matrix,pos:{x:player.pos.x,y:ghostY+1}})) ghostY++;
 drawMatrix(player.matrix,{x:player.pos.x,y:ghostY},ctx,BLOCK,0.3);
}

function draw(){
 ctx.fillStyle="#000";
 ctx.fillRect(0,0,canvas.width,canvas.height);
 drawMatrix(board,{x:0,y:0});
 drawGhost();
 drawMatrix(player.matrix,player.pos);
 if(paused){
   ctx.fillStyle="rgba(0,0,0,0.8)";
   ctx.fillRect(0,0,canvas.width,canvas.height);
   ctx.save();
   ctx.textAlign="center";
   ctx.fillStyle="#b5ff52";
   ctx.font="bold 24px monospace";
   ctx.fillText("PAUSED",canvas.width/2,canvas.height/2-8);
   ctx.fillStyle="#fff";
   ctx.font="13px monospace";
   ctx.fillText("P / Resume to play",canvas.width/2,canvas.height/2+20);
   ctx.restore();
 }
 if(gameOver){
   ctx.fillStyle="rgba(0,0,0,0.85)";
   ctx.fillRect(0,0,canvas.width,canvas.height);
   ctx.save();ctx.textAlign="center";ctx.fillStyle="#b5ff52";
   ctx.font="bold 22px monospace";
   ctx.fillText("GAME OVER",canvas.width/2,canvas.height/2-8);
   ctx.fillStyle="#fff";ctx.font="13px monospace";
   ctx.fillText("R / Restart to play",canvas.width/2,canvas.height/2+20);
   ctx.restore();
 }
}

function updateFlagsDisplay() {
 const flags = [
   ["Extra Shapes", ENABLE_EXTRA_SHAPES],
   ["Wall Kick", ENABLE_WALL_KICK],
   ["Ghost Piece", ENABLE_GHOST],
   ["Combo", ENABLE_COMBO],
   ["Levels", ENABLE_LEVELS],
   ["Hold", ENABLE_HOLD]
 ];
 const flagsElement = document.getElementById("flags");
 const wasOpen = flagsElement.querySelector("details")?.open ?? !touchLayout.matches;
 flagsElement.innerHTML = '<details'+(wasOpen ? ' open' : '')+'><summary>Settings</summary>' + flags.map(
   ([label, enabled]) => `<div class="flag"><span>${label}</span><span class="state${enabled ? " active" : ""}">${enabled ? "ON" : "OFF"}</span></div>`
 ).join("")+'</details>';
 document.getElementById("pause-status").textContent = gameOver ? "Game over — restart to play" : paused ? "Paused — P / Resume to play" : "Playing";
 const pauseButton = document.querySelector('[data-action="p"]');
 pauseButton.textContent = paused ? "Resume" : "Pause";
 pauseButton.setAttribute("aria-pressed",String(paused));
 document.querySelectorAll("#touch-controls button").forEach(button => {
   const action=button.dataset.action;
   button.disabled = action !== "r" && (gameOver || (paused && action !== "p"));
 });
}

function update(time=0){
 const delta=time-lastTime; lastTime=time;
 if(!paused && !gameOver){
   dropCounter+=delta;
   if(dropCounter>dropInterval) playerDrop();
 }
 draw();
 requestAnimationFrame(update);
}

const pressedKeys = new Set();
const activePointers = new Map();
const keyAliases = {arrowleft: "a", arrowright: "d", arrowdown: "s", arrowup: "w"};
const touchLayout = window.matchMedia("(max-width: 700px), (any-pointer: coarse)");
const landscapeLayout = window.matchMedia("(max-height: 540px) and (orientation: landscape)");
function updateKeyDisplay(){
 const active = new Set([...pressedKeys].map(key => keyAliases[key] || key));
 for(const pointer of activePointers.values()) active.add(pointer.action);
 document.querySelectorAll("kbd[data-key]").forEach(el => el.classList.toggle("pressed",active.has(el.dataset.key)));
 document.querySelectorAll("[data-action]").forEach(el => el.classList.toggle("pressed",active.has(el.dataset.action)));
}
function releasePointer(id){
 const pointer=activePointers.get(id);
 if(!pointer) return;
 clearTimeout(pointer.timer);
 activePointers.delete(id);
 if(pointer.button.hasPointerCapture(id)) pointer.button.releasePointerCapture(id);
 updateKeyDisplay();
}
function clearHeldInputs(){
 for(const id of [...activePointers.keys()]) releasePointer(id);
 pressedKeys.clear();
 updateKeyDisplay();
}
function performAction(k){
 if(k==="r"){
   clearHeldInputs();
   board=createMatrix(COLS,ROWS);score=lines=0;level=1;combo=0;
   dropInterval=800;dropCounter=0;lastTime=performance.now();
   holdMatrix=null;nextMatrix=null;canHold=true;drawHold();
   paused=false;gameOver=false;playerReset();drawHUD();updateFlagsDisplay();
   return;
 }
 if(gameOver) return;
 if(k==="p"){
   clearHeldInputs();
   paused=!paused;
   lastTime=performance.now();
   updateFlagsDisplay();
   return;
 }
 if(paused) return;
 if(k==="a") playerMove(-1);
 else if(k==="d") playerMove(1);
 else if(k==="s") playerDrop();
 else if(k==="w") playerRotate(1);
 else if(k==="c") holdPiece();
 else if(k==="x"){ENABLE_EXTRA_SHAPES=!ENABLE_EXTRA_SHAPES; playerReset(); updateFlagsDisplay();}
 else if(k==="k"){ENABLE_WALL_KICK=!ENABLE_WALL_KICK; updateFlagsDisplay();}
 else if(k==="g"){ENABLE_GHOST=!ENABLE_GHOST; updateFlagsDisplay();}
}
document.addEventListener("keydown",e=>{
 if(e.ctrlKey || e.metaKey || e.altKey || e.target.closest("input,textarea,select,[contenteditable]")) return;
 const key=e.key.toLowerCase();
 const k=keyAliases[key] || key;
 if(!["a","d","s","w","c","p","x","k","g","r"].includes(k)) return;
 e.preventDefault();
 pressedKeys.add(key);
 updateKeyDisplay();
 if(e.repeat && ["p","x","k","g","r"].includes(k)) return;
 performAction(k);
});
document.addEventListener("keyup",e=>{
 pressedKeys.delete(e.key.toLowerCase());
 updateKeyDisplay();
});
for(const button of document.querySelectorAll("#touch-controls button")){
 button.addEventListener("contextmenu",event=>event.preventDefault());
 button.addEventListener("pointerdown",event=>{
   if(event.button !== 0 || button.disabled) return;
   event.preventDefault();
   const action=button.dataset.action;
   button.setPointerCapture(event.pointerId);
   const pointer={action,button,timer:null};
   activePointers.set(event.pointerId,pointer);
   updateKeyDisplay();
   performAction(action);
   if(["a","d","s"].includes(action) && activePointers.has(event.pointerId)){
     const repeat=()=>{
       if(!activePointers.has(event.pointerId)) return;
       performAction(action);
       if(activePointers.has(event.pointerId)) pointer.timer=setTimeout(repeat,80);
     };
     pointer.timer=setTimeout(repeat,250);
   }
 });
 for(const eventName of ["pointerup","pointercancel","lostpointercapture"]){
   button.addEventListener(eventName,event=>releasePointer(event.pointerId));
 }
 // Native keyboard and assistive-technology activation has no pointerdown.
 button.addEventListener("click",event=>{ if(event.detail===0) performAction(button.dataset.action); });
}
window.addEventListener("blur",clearHeldInputs);
document.addEventListener("visibilitychange",()=>{
 if(document.hidden){
   clearHeldInputs();
   if(!gameOver && !paused) performAction("p");
 }
});
function resizeGame(){
 if(!touchLayout.matches && !landscapeLayout.matches){
   canvas.style.width="240px";canvas.style.height="480px";return;
 }
 const area=document.getElementById("game-area");
 const hud=document.getElementById("hud");
 const controls=document.getElementById("touch-controls");
 const title=document.querySelector("h1");
 const viewportHeight=window.visualViewport?.height || window.innerHeight;
 const bodyStyle=getComputedStyle(document.body);
 const padding=parseFloat(bodyStyle.paddingTop)+parseFloat(bodyStyle.paddingBottom);
 const reserved=title.offsetHeight+padding+(landscapeLayout.matches ? 20 : controls.offsetHeight+40);
 const availableWidth=area.clientWidth-hud.offsetWidth-18;
 const availableHeight=viewportHeight-reserved;
 const width=Math.max(60,Math.floor(Math.min(240,availableWidth,availableHeight/2)));
 canvas.style.width=width+"px";
 canvas.style.height=(width*2)+"px";
}
window.addEventListener("resize",resizeGame);
window.visualViewport?.addEventListener("resize",resizeGame);
touchLayout.addEventListener("change",()=>{clearHeldInputs();resizeGame();});
resizeGame();

board=createMatrix(COLS,ROWS);
const player={pos:{x:0,y:0},matrix:null};
playerReset(); drawHUD(); updateFlagsDisplay(); update();
</script>
</body>
</html>
